# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  workspaces:
    name: List npm workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      checks: ${{ steps.set-matrix.outputs.checks }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          npm --version | grep -q '^12\.' || npm i -g npm@12

      # Workspace discovery needs the lockfile-installed workspace links, but
      # no check executes here. Keep its no-scripts tree separate from the
      # full tree used by the matrix jobs.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-noscripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci --ignore-scripts

      - name: Build check matrix
        id: set-matrix
        run: |
          node -e '
          const { execSync } = require("child_process");
          const pkgs = JSON.parse(execSync("npm query .workspace", { encoding: "utf-8" }));
          if (pkgs.length === 0) {
            console.error("::error::Workspace discovery produced an empty package list — refusing to skip all JS/TS checks.");
            process.exit(1);
          }
          const checks = [];
          for (const pkg of pkgs) {
            const scripts = pkg.scripts || {};
            const subs = Object.keys(scripts).filter(s => /^check:.+$/.test(s));
            if (subs.length > 0) {
              for (const script of subs) checks.push({ package: pkg.location, script });
            } else if (scripts.check) {
              checks.push({ package: pkg.location, script: "check" });
            }
          }
          if (checks.length === 0) {
            console.error("::error::No check scripts found in any workspace package.");
            process.exit(1);
          }
          process.stdout.write("checks=" + JSON.stringify(checks) + "\n");
          ' >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.package }} / ${{ matrix.script }}
    needs: workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.workspaces.outputs.checks) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      # These dependencies belong only to the Electron-platform test unit.
      # Its SSH probes require zsh, and its live portal test launches Electron
      # through xvfb-run on headless Linux.
      - name: Install zsh and a virtual display for Electron
        if: matrix.package == 'apps/desktop' && matrix.script == 'check:test:desktop:platforms'
        run: |
          sudo apt-get install -y zsh xvfb \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      - name: grab npm 12
        run: |
          npm --version | grep -q '^12\.' || npm i -g npm@12

      # Every matrix leg needs the same full install. The exact lockfile cache
      # avoids repeating extraction and Electron postinstall work on a hit.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      - name: Run workspace check
        run: npm run --prefix ${{ matrix.package }} ${{ matrix.script }}
