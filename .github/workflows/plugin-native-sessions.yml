name: Plugin native sessions

on:
  workflow_call:
  pull_request:
    paths:
      - agent/plugin_*.py
      - agent/transports/codex_app_server*.py
      - hermes_cli/plugin_workspace*.py
      - tests/agent/test_plugin_*.py
      - tests/agent/transports/test_codex_app_server*.py
      - tests/plugins/test_workspace_trees.py
      - scripts/ci/plugin_native_sandbox.sh
      - scripts/ci/plugin_native_acceptance.sh
      - tests/scripts/test_plugin_native_sandbox.py
      - .github/workflows/plugin-native-sessions.yml
  push:
    branches: [main]
    paths:
      - agent/plugin_*.py
      - agent/transports/codex_app_server*.py
      - hermes_cli/plugin_workspace*.py
      - tests/agent/test_plugin_*.py
      - tests/agent/transports/test_codex_app_server*.py
      - tests/plugins/test_workspace_trees.py
      - scripts/ci/plugin_native_sandbox.sh
      - scripts/ci/plugin_native_acceptance.sh
      - tests/scripts/test_plugin_native_sandbox.py
      - .github/workflows/plugin-native-sessions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-native-sessions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native session acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked host and test dependencies
        run: uv sync --locked --extra dev --python 3.11
      - name: Install accepted native runtime through npm
        run: |
          npm install --prefix "$RUNNER_TEMP/native-runtime" --no-save --ignore-scripts --no-audit --no-fund @openai/codex@0.161.0
          test "$("$RUNNER_TEMP/native-runtime/node_modules/.bin/codex" --version)" = 'codex-cli 0.161.0'
          echo "$RUNNER_TEMP/native-runtime/node_modules/.bin" >>"$GITHUB_PATH"
      - name: Prepare scoped native sandbox support
        run: bash scripts/ci/plugin_native_sandbox.sh
      - name: Exercise native sessions, isolation and recovery
        run: bash scripts/ci/plugin_native_acceptance.sh "$PWD/.venv/bin/python" "$RUNNER_TEMP/native-session-results.xml"
