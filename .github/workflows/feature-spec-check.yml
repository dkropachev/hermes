name: Feature Spec Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  feature-spec-check:
    name: Validate feature specs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate feature-spec catalog
        run: python3 scripts/check_feature_specs.py
